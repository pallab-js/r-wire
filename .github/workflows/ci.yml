name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [created]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # FRONTEND TESTS
  # ============================================================================
  frontend-test:
    name: Frontend Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run check

      - name: Unit Tests
        run: npm run test:unit

  # ============================================================================
  # RUST TESTS
  # ============================================================================
  rust-test:
    name: Rust Test
    # Pinned: Tauri v1 links against webkit2gtk-4.0, which Ubuntu 24.04
    # (ubuntu-latest) no longer ships — see packages.ubuntu.com/noble.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      # Clippy and the test build compile the whole crate, so every system
      # library the *-sys crates probe for through pkg-config must exist:
      # GTK/WebKit for Tauri's windowing, libpcap for packet capture.
      # rusqlite is bundled and needs nothing.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev \
            libpcap-dev build-essential curl wget file pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check Format
        run: cd src-tauri && cargo fmt --check

      - name: Clippy Lints
        run: cd src-tauri && cargo clippy --locked -- -D warnings

      - name: Run Tests
        run: cd src-tauri && cargo test --locked

  # ============================================================================
  # BUILD: macOS
  # ============================================================================
  build-macos:
    name: Build macOS
    needs: [frontend-test, rust-test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build -- --bundles dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: auracap-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 7

  # ============================================================================
  # SECURITY AUDIT
  # ============================================================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Audit
        run: cargo install cargo-audit --locked && cd src-tauri && cargo audit

  # ============================================================================
  # RELEASE (on tag)
  # ============================================================================
  release:
    name: Create Release
    needs: [build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Prepare Release
        id: prepare_release
        run: |
          echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
          generate_release_notes: true
          files: |
            artifacts/auracap-macos/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
